services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lol-api
    restart: on-failure
    depends_on:
      - db
    environment:
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-https://example.com}
      CHAT_SERVICE_KEY: ${CHAT_SERVICE_KEY:-key}
    ports:
      - 8080:8080